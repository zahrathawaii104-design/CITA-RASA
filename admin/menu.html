<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="theme-color" content="#1B4332"><meta name="robots" content="noindex,nofollow">
<title>Menu - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css"></head>
<body data-page="menu"><nav class="top"><b>Admin</b><a href="index.html">Dashboard</a><a href="menu.html" class=active>Menu</a><a href="kategori.html">Kategori</a><button id="logout">Keluar</button></nav><div class="wrap"><div id="msg" class="msg hide" role="status"></div><h1>Kelola Menu</h1>
<form class="panel" id="f"><h2 id="ftitle">Tambah paket</h2><input type="hidden" id="image_url">
<div class="f2"><div><label for="name">Nama paket</label><input id="name" required></div>
<div><label for="category_id">Kategori</label><select id="category_id" required></select></div>
<div><label for="price">Harga (Rp)</label><input type="number" id="price" min="0" step="500" required></div>
<div><label for="price_unit">Satuan harga</label><select id="price_unit"><option>Per box</option><option>Per orang</option><option>Per paket</option></select></div></div>
<label for="description">Deskripsi</label><textarea id="description"></textarea>
<label for="contents">Isi paket (satu item per baris)</label><textarea id="contents" rows="5"></textarea>
<label for="foto">Foto (maks. 3 MB)</label><input type="file" id="foto" accept="image/*"><img id="prev" alt="" style="max-width:160px;margin-top:8px;border-radius:8px">
<div class="row" style="margin-top:12px"><input type="checkbox" id="is_active" checked><label for="is_active">Tampilkan di website</label></div>
<button class="btn" id="save" type="submit">Simpan paket</button><button class="btn alt" id="reset" type="button">Batal</button></form>
<div class="panel tw"><table><thead><tr><th>Foto</th><th>Paket</th><th>Harga</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script><script src="../js/admin.js"></script></body></html>
